# FightSafe AI — optional LaTeX build for archived IF manuscript (legacy/fusion2026).
# Active EAAI manuscript lives outside this GitHub repo in sibling ../paper1/.
name: paper

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fusion-pdf:
    name: build archived fusion2026 PDF (optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate manuscript
        id: ms
        run: |
          if [[ -f ../legacy/fusion2026/main.tex ]]; then
            echo "dir=../legacy/fusion2026" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "legacy/fusion2026/main.tex not found — skipping LaTeX build (expected on GitHub-only checkouts)."
          fi

      - name: Install TeX Live
        if: steps.ms.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra

      - name: Build fusion2026 PDF
        if: steps.ms.outputs.found == 'true'
        working-directory: ${{ steps.ms.outputs.dir }}
        run: |
          pdflatex -interaction=nonstopmode main.tex || true
          bibtex main || true
          pdflatex -interaction=nonstopmode main.tex || true
          pdflatex -interaction=nonstopmode main.tex

      - name: Upload PDF
        if: steps.ms.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fusion2026-main-pdf
          path: ${{ steps.ms.outputs.dir }}/main.pdf
